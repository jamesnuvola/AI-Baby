name: Daily Lottery Research

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/daily-lottery-research.yml"
      - "scripts/daily_lottery_sweep.py"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-lottery-research
  cancel-in-progress: false

jobs:
  variable-sweep:
    name: Sweep new variables and persist report
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate code and data before research
        run: |
          python -m unittest discover -s tests -v
          python -c "from ai_baby.lottery import load_draws_csv; assert len(load_draws_csv('data/superenalotto_snapshot_2026-10-27.csv', game='superenalotto')) == 2943; assert len(load_draws_csv('data/vincicasa_snapshot_2026-10-27.csv', game='vincicasa')) == 3390"
      - name: Run daily parameter sweep
        run: python -m scripts.daily_lottery_sweep
      - name: Persist dated and latest reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/continuous/
          if git diff --cached --quiet; then
            echo "No report changes to persist."
          else
            git commit -m "research: daily lottery variable sweep $(date -u +%F)"
            git push origin HEAD:main
          fi
      - name: Upload report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-lottery-research-${{ github.run_id }}
          path: reports/continuous/
          if-no-files-found: warn
          retention-days: 90
